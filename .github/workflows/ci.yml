name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and verify
        run: ./mvnw verify -B
        env:
          # Testcontainers pulls a PostgreSQL image; Docker is available on
          # the ubuntu-latest runner by default.
          # JWT_SECRET is required by the app context even in slice tests that
          # import SecurityConfig — provide a dummy value here.
          JWT_SECRET: ci-test-secret-key-must-be-at-least-32-characters-long

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7
