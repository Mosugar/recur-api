name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push on the same PR cancels the run that is now out of date
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # setup-java only caches ~/.m2/repository; the Maven distribution downloaded by
      # ./mvnw lives in ~/.m2/wrapper and was fetched again (and sometimes failed) on every run
      - name: Cache Maven wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Build and verify
        run: ./mvnw verify -B
        env:
          # Testcontainers pulls a PostgreSQL image; Docker is available on
          # the ubuntu-latest runner by default.
          # JWT_SECRET is required by the app context even in slice tests that
          # import SecurityConfig — provide a dummy value here.
          JWT_SECRET: ci-test-secret-key-must-be-at-least-32-characters-long

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  docker:
    name: Docker image & compose
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Follows the README: copy .env.example, then start the whole stack
      - name: Start PostgreSQL and the API
        run: |
          cp .env.example .env
          docker compose up --build --detach

      - name: Wait for the API health check
        run: |
          for i in $(seq 1 60); do
            if curl --silent --fail http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "API is UP after ~$((i * 3)) s"
              exit 0
            fi
            sleep 3
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
