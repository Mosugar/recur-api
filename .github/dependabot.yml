version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Minor and patch bumps land in one PR; majors stay separate so each can be tested
      maven-minor-patch:
        update-types: [minor, patch]

  # Base images of the Dockerfile (eclipse-temurin JDK / JRE)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    commit-message:
      prefix: "docker"

  # postgres image of docker-compose.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Paris
    commit-message:
      prefix: "docker"
    ignore:
      # A PostgreSQL major upgrade needs a data migration (pg_upgrade or dump/restore)
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Paris
    commit-message:
      prefix: "ci"
