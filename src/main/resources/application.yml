spring:
  application:
    name: recur-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:recur}
    username: ${DB_USER:recur}
    password: ${DB_PASSWORD:recur}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    filter:
      order: 10

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 h default

---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

  datasource:
    url: jdbc:postgresql://localhost:5432/recur_dev
    username: recur
    password: recur

app:
  jwt:
    secret: dev-secret-key-change-in-production-must-be-long-enough-for-hs256
    expiration-ms: 86400000

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:postgresql://localhost:5432/recur_test
    username: recur
    password: recur

  flyway:
    baseline-on-migrate: true

app:
  jwt:
    secret: test-secret-key-for-testing-only-must-be-long-enough-for-hs256
    expiration-ms: 3600000
